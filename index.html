<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Python Quest</title>
<meta name="description" content="A hands-on introduction to Python coding for children. Write and run real code, earn stars and get a certificate.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lexend:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: level tabs, then a stepping-stone path, then one mission at a time. Pip the snake guides each step. */
:root {
  --bg: #EFF5EA;
  --surface: #FFFFFF;
  --ink: #1C2A21;
  --muted: #5B6B60;
  --line: #D5E2CF;
  --leaf: #2F8A57;
  --leaf-soft: #DDF0E2;
  --sun: #FFC83D;
  --sun-ink: #6B4A00;
  --coral: #D8513B;
  --coral-soft: #FDE6E1;
  --code-bg: #182420;
  --code-ink: #E7F2EA;
  --code-dim: #8FA79A;
  --on-leaf: #FFFFFF;
  --font-display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Lexend", "Segoe UI", system-ui, sans-serif;
  --font-code: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121A15; --surface: #1B261F; --ink: #E8F1EA; --muted: #9DB0A3; --line: #2C3B31;
    --leaf: #5CC78A; --leaf-soft: #1F3A2A; --sun: #FFCF57; --sun-ink: #FFE4A0;
    --coral: #FF8A73; --coral-soft: #3A211C; --code-bg: #0C1310; --code-ink: #E7F2EA; --code-dim: #7E978A;
    --on-leaf: #0D1A12;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121A15; --surface: #1B261F; --ink: #E8F1EA; --muted: #9DB0A3; --line: #2C3B31;
  --leaf: #5CC78A; --leaf-soft: #1F3A2A; --sun: #FFCF57; --sun-ink: #FFE4A0;
  --coral: #FF8A73; --coral-soft: #3A211C; --code-bg: #0C1310; --code-ink: #E7F2EA; --code-dim: #7E978A;
  --on-leaf: #0D1A12;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body {
  margin: 0;
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 17px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

/* Header */
header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; flex: 1 1 auto; min-width: 0; }
.brand svg { flex: none; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 2rem; line-height: 1; margin: 0; letter-spacing: -0.01em; }
.sub { color: var(--muted); font-size: 0.9rem; margin: 4px 0 0; }
.stars { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.star { width: 26px; height: 26px; }
.star path { fill: var(--line); transition: fill .3s; }
.star.on path { fill: var(--sun); }
.star.pop { animation: pop .5s ease; }
@keyframes pop { 50% { transform: scale(1.5) rotate(12deg); } }

/* Level tabs */
.levels { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.level {
  display: flex; align-items: center; gap: 10px; text-align: left;
  background: var(--surface); color: var(--ink); border: 2px solid var(--line); border-radius: 16px;
  padding: 10px 14px; cursor: pointer; font-family: var(--font-body); min-width: 0;
}
.level .badge {
  flex: none; width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center;
  background: var(--leaf-soft); color: var(--leaf); font-family: var(--font-display); font-weight: 700; font-size: 1.2rem;
}
.level .txt { min-width: 0; }
.level .name { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; line-height: 1.15; display: block; }
.level .meta { color: var(--muted); font-size: 0.8rem; display: block; }
.level.current { border-color: var(--leaf); background: var(--leaf-soft); }
.level.current .badge { background: var(--leaf); color: var(--on-leaf); }
.level.locked .badge { background: var(--line); color: var(--muted); }

/* Stepping stones */
.path { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 8px; scrollbar-width: thin; }
.stone {
  flex: 1 0 auto; display: flex; align-items: center; gap: 8px;
  border: 2px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 999px; padding: 6px 14px 6px 6px; cursor: pointer;
  font-family: var(--font-body); font-size: 0.85rem; font-weight: 500; white-space: nowrap;
}
.stone .n {
  width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
  background: var(--leaf-soft); color: var(--leaf); font-family: var(--font-display); font-weight: 700;
}
.stone.current { border-color: var(--leaf); }
.stone.done .n { background: var(--sun); color: var(--sun-ink); }
.stone:focus-visible, .level:focus-visible, button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }

/* Lesson card */
.lesson { background: var(--surface); border: 2px solid var(--line); border-radius: 22px; padding: 26px clamp(18px, 4vw, 34px); display: flex; flex-direction: column; gap: 18px; }
.eyebrow { font-family: var(--font-display); font-weight: 600; color: var(--leaf); text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.8rem; }
h2 { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.6rem, 4.5vw, 2.2rem); line-height: 1.1; margin: 2px 0 0; text-wrap: balance; }
.pip { display: grid; grid-template-columns: 48px 1fr; gap: 12px; align-items: start; }
.bubble { background: var(--leaf-soft); border-radius: 4px 18px 18px 18px; padding: 12px 16px; min-width: 0; }
.bubble p { margin: 0 0 8px; max-width: 62ch; }
.bubble p:last-child { margin-bottom: 0; }
.bubble ul { margin: 0; padding-left: 1.2em; }
.bubble li { margin-bottom: 4px; }
code.k { font-family: var(--font-code); font-size: 0.88em; background: var(--surface); border: 1px solid var(--line); padding: 1px 6px; border-radius: 6px; white-space: nowrap; }

/* Editor + console */
.ide { border-radius: 16px; overflow: hidden; background: var(--code-bg); border: 2px solid var(--code-bg); }
.ide-bar { display: flex; align-items: center; gap: 8px; padding: 8px 10px 8px 14px; flex-wrap: wrap; }
.ide-bar .file { color: var(--code-dim); font-family: var(--font-code); font-size: 0.8rem; flex: 1; }
textarea#code {
  display: block; width: 100%; min-height: 150px; resize: vertical; border: 0;
  background: var(--code-bg); color: var(--code-ink); caret-color: var(--sun);
  font-family: var(--font-code); font-size: 15px; line-height: 1.6; padding: 4px 16px 14px;
  tab-size: 4; white-space: pre; overflow-x: auto;
}
textarea#code:focus-visible { outline-offset: -3px; }
.btn {
  font-family: var(--font-display); font-weight: 600; font-size: 1rem; border: 0; border-radius: 12px;
  padding: 9px 16px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn.run { background: var(--sun); color: #3A2A00; font-size: 1.1rem; padding: 10px 22px; box-shadow: 0 3px 0 #C99400; }
.btn.run:active { transform: translateY(2px); box-shadow: 0 1px 0 #C99400; }
.btn.run:disabled { opacity: .6; cursor: wait; }
.btn.ghost { background: transparent; color: var(--code-dim); border: 1px solid #33463C; font-size: 0.85rem; padding: 7px 12px; }
.btn.ghost:hover { color: var(--code-ink); }
.console { border-top: 1px dashed #33463C; padding: 12px 16px 14px; font-family: var(--font-code); font-size: 15px; color: var(--code-ink); min-height: 64px; }
.console .label { color: var(--code-dim); font-size: 0.75rem; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 6px; font-family: var(--font-body); }
.console pre { margin: 0; white-space: pre-wrap; word-break: break-word; font: inherit; max-height: 320px; overflow-y: auto; }
.console .placeholder { color: var(--code-dim); font-style: italic; }
.ask { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.ask input {
  flex: 1 1 180px; min-width: 0; font: inherit; background: #23342C; color: var(--code-ink);
  border: 2px solid var(--sun); border-radius: 10px; padding: 7px 10px;
}
#stage { display: none; margin-top: 10px; background: #FFFFFF; border-radius: 12px; width: 300px; max-width: 100%; height: 300px; overflow: hidden; position: relative; }
#stage.show { display: block; }

.helper { background: var(--coral-soft); color: var(--ink); border-radius: 14px; padding: 12px 16px; font-size: 0.95rem; }
.helper strong { color: var(--coral); }

/* Mission */
.mission { border: 2px dashed var(--sun); border-radius: 16px; padding: 14px 18px; display: flex; flex-direction: column; gap: 8px; }
.mission h3 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; display: flex; align-items: center; gap: 8px; }
.mission p { margin: 0; max-width: 62ch; }
.mission.won { border-style: solid; border-color: var(--leaf); background: var(--leaf-soft); }
.mission .status { font-weight: 600; color: var(--leaf); }
.mission .status:empty { display: none; }
.hint-btn { align-self: flex-start; background: none; border: 0; color: var(--muted); font: inherit; font-size: 0.9rem; text-decoration: underline; cursor: pointer; padding: 0; }
.hint { color: var(--muted); font-size: 0.95rem; }
.hint code { font-family: var(--font-code); }

.nav { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.btn.back { background: transparent; color: var(--muted); border: 2px solid var(--line); }
.btn.next { background: var(--leaf); color: var(--on-leaf); }
.btn.soft { background: var(--leaf-soft); color: var(--leaf); }

/* Finish + certificate */
.finish { text-align: center; align-items: center; }
.finish .big { font-family: var(--font-display); font-size: clamp(2rem, 7vw, 3rem); font-weight: 700; line-height: 1.05; margin: 0; text-wrap: balance; }
.finish .bubble { text-align: left; width: 100%; max-width: 560px; }
.finish p { margin: 0; }
.cert-box { width: 100%; display: flex; flex-direction: column; gap: 12px; align-items: center; border-top: 2px dashed var(--line); padding-top: 18px; }
.cert-box h3 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 1.3rem; }
.name-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; width: 100%; }
.name-row label { font-weight: 500; }
.name-row input {
  font: inherit; font-size: 1.05rem; padding: 8px 12px; border-radius: 12px; border: 2px solid var(--line);
  background: var(--bg); color: var(--ink); width: 240px; max-width: 100%;
}
#cert { width: 100%; max-width: 640px; aspect-ratio: 1200 / 850; height: auto; border-radius: 8px; box-shadow: 0 6px 24px rgba(0,0,0,.15); background: #FFFDF6; }
.cert-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.small-note { color: var(--muted); font-size: 0.85rem; }
.lockcard { text-align: center; align-items: center; }
.lockcard p { max-width: 52ch; margin: 0; }

.burst { position: fixed; pointer-events: none; width: 10px; height: 10px; border-radius: 3px; z-index: 50; animation: fly .9s ease-out forwards; }
@keyframes fly { to { transform: translate(var(--dx), var(--dy)) rotate(260deg); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .burst { display: none; } .star.pop { animation: none; } }

.loading { color: var(--muted); font-size: 0.9rem; text-align: center; }
footer { color: var(--muted); font-size: 0.8rem; text-align: center; }
footer a { color: inherit; }
@media (max-width: 520px) {
  body { font-size: 16px; }
  .pip { grid-template-columns: 1fr; }
  .pip svg { display: none; }
  h1 { font-size: 1.6rem; }
  .levels { grid-template-columns: 1fr; }
}

@page { size: A4 landscape; margin: 12mm; }
@media print {
  body { background: #FFFFFF; padding: 0; }
  body * { visibility: hidden; }
  #cert, #cert * { visibility: visible; }
  #cert { position: fixed; left: 0; top: 0; width: 100%; max-width: none; box-shadow: none; border-radius: 0; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <svg width="54" height="54" viewBox="0 0 54 54" aria-hidden="true">
        <circle cx="27" cy="27" r="26" fill="var(--leaf-soft)"/>
        <path d="M10 38 C16 30, 22 44, 28 36 S 38 26, 34 20" fill="none" stroke="var(--leaf)" stroke-width="7" stroke-linecap="round"/>
        <circle cx="35" cy="18" r="7.5" fill="var(--leaf)"/>
        <circle cx="37.5" cy="16.5" r="2.2" fill="#FFFFFF"/>
        <circle cx="38" cy="16.6" r="1.1" fill="#1C2A21"/>
        <path d="M41.5 21 l4 1.5 m-4 -1.5 l3.5 3" stroke="var(--coral)" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <div>
        <h1>Python Quest</h1>
        <p class="sub">Two levels · about 10 minutes each · real Python code</p>
      </div>
    </div>
    <div class="stars" id="stars" aria-label="Stars earned"></div>
  </header>

  <div class="levels" id="levels" role="tablist" aria-label="Levels"></div>
  <nav class="path" id="path" aria-label="Missions"></nav>

  <main class="lesson" id="lesson" aria-live="polite"></main>
  <p class="loading" id="loading">Waking up Python…</p>
  <footer>Python runs in your browser using <a href="https://skulpt.org" target="_blank" rel="noopener">Skulpt</a>. Nothing you type is sent anywhere.</footer>
</div>

<script src="engine/skulpt.min.js"></script>
<script src="engine/skulpt-stdlib.js"></script>
<script>
const LEVELS = [
  {
    name: "First steps",
    short: "Level 1",
    learned: [
      "<code class='k'>print()</code> shows things on the screen",
      "Variables are labelled boxes that remember things",
      "Python can do maths with <code class='k'>+ - * /</code>",
      "<code class='k'>input()</code> asks the player a question",
      "<code class='k'>if</code> and <code class='k'>else</code> make choices",
      "<code class='k'>for</code> loops repeat things, like drawing shapes"
    ],
    certLine: "Level 1: First Steps",
    skills: "print · variables · maths · input · if / else · loops",
    steps: [
      {
        id: "hello", nav: "Say hello",
        title: "Make the computer talk",
        pip: [
          "Hi, I'm Pip! I speak Python, a language that lots of real programmers use to build games, websites and even space robots.",
          "The word <code class='k'>print</code> tells Python to show something on the screen. Words go inside quote marks, like <code class='k'>\"this\"</code>. Press the yellow <b>Run</b> button to see what happens."
        ],
        code: 'print("Hello, world!")\nprint("I am learning Python")',
        mission: "Change the first line so Python says hello to <b>you</b>, using your own name. Then press Run.",
        hint: 'Swap the word <code>world</code> for your name, but keep the quote marks: <code>print("Hello, Sam!")</code>',
        check: (code, out) => /print\s*\(/.test(code) && out.trim() !== "" && !/Hello, world!/.test(out),
        win: "Brilliant! You just wrote your first program."
      },
      {
        id: "boxes", nav: "Boxes",
        title: "Variables are labelled boxes",
        pip: [
          "A <b>variable</b> is like a box with a label on it. You can put something in the box and use it later.",
          "<code class='k'>age = 10</code> means: make a box called <i>age</i> and put 10 inside. Notice there are no quote marks round the name of the box, only round words you want to keep exactly."
        ],
        code: 'name = "Alex"\nage = 10\nprint(name, "is", age, "years old")',
        mission: "Make a new box called <code class='k'>pet</code> with an animal in it, then print it. Try changing <i>name</i> and <i>age</i> too!",
        hint: 'Add two lines at the bottom: <code>pet = "dog"</code> and then <code>print("My pet is a", pet)</code>',
        check: (code, out) => /^\s*pet\s*=/m.test(code) && /print\s*\([^)]*\bpet\b/.test(code) && out.trim() !== "",
        win: "Nice! Your program remembers things now."
      },
      {
        id: "maths", nav: "Maths",
        title: "Python is a super calculator",
        pip: [
          "Python is amazing at maths. Use <code class='k'>+</code> to add, <code class='k'>-</code> to take away, <code class='k'>*</code> to multiply and <code class='k'>/</code> to divide.",
          "Numbers don't need quote marks. Run this and check Python's answers. Are they right?"
        ],
        code: 'print(7 + 5)\nprint(100 - 1)\nprint(6 * 8)\nprint(20 / 4)',
        mission: "How many <b>seconds</b> are there in one whole day? There are 60 seconds in a minute, 60 minutes in an hour and 24 hours in a day. Get Python to work it out!",
        hint: "Multiply all three numbers in one line: <code>print(60 * 60 * 24)</code>",
        check: (code, out) => /\b86400\b/.test(out),
        win: "86,400 seconds! Python did that faster than you could blink."
      },
      {
        id: "questions", nav: "Questions",
        title: "Ask the player a question",
        pip: [
          "<code class='k'>input()</code> lets your program ask a question and wait for an answer. The answer goes into a box (a variable).",
          "When you press Run, a typing box will pop up below the code. Type your answer and press Enter. The <code class='k'>+</code> sign glues words together."
        ],
        code: 'name = input("What is your name? ")\nprint("Nice to meet you, " + name + "!")',
        mission: "Add a second question that asks for a favourite food, and make Python say something about it.",
        hint: 'Add: <code>food = input("What is your favourite food? ")</code> then <code>print("Yum! I love " + food + " too!")</code>',
        check: (code, out) => (code.match(/input\s*\(/g) || []).length >= 2 && out.trim() !== "",
        win: "Your program is having a real conversation!"
      },
      {
        id: "choices", nav: "Choices",
        title: "Make a guessing game",
        pip: [
          "<code class='k'>if</code> lets Python make choices. If something is true, do one thing. <code class='k'>else</code>, do something different.",
          "Two equals signs <code class='k'>==</code> means <i>\"is it the same?\"</i>. Notice the colon <code class='k'>:</code> and the spaces at the start of the lines underneath. Python needs those!",
          "<code class='k'>int()</code> turns typed text into a number so Python can compare it."
        ],
        code: 'secret = 7\nguess = int(input("Guess my number from 1 to 10: "))\n\nif guess == secret:\n    print("You got it! You are a genius!")\nelse:\n    print("Nope! Try again.")',
        mission: "Win your own game! Run it and guess until Python says <i>You got it</i>. Then try changing the secret number.",
        hint: "Look at the very first line. The secret number is right there!",
        check: (code, out) => /You got it/i.test(out),
        win: "You made a game. That's what real game makers do!"
      },
      {
        id: "turtle", nav: "Drawing",
        title: "Loops and turtle drawing",
        pip: [
          "A <b>loop</b> repeats things so you don't have to type them again and again. <code class='k'>for i in range(4):</code> means <i>\"do this 4 times\"</i>.",
          "This program uses a <b>turtle</b> that draws a line wherever it walks. It moves forward 100 steps, then turns right 90 degrees, four times. What shape will it make?"
        ],
        code: 'import turtle\n\nt = turtle.Turtle()\nt.shape("turtle")\nt.color("green")\nt.pensize(4)\n\nfor i in range(4):\n    t.forward(100)\n    t.right(90)',
        mission: "Make the turtle draw a <b>triangle</b> instead. A triangle has 3 sides, and the turtle needs to turn 120 degrees at each corner.",
        hint: "Change <code>range(4)</code> to <code>range(3)</code> and <code>right(90)</code> to <code>right(120)</code>. Bonus: try <code>range(5)</code> with <code>right(144)</code> for a star!",
        check: (code) => /range\s*\(\s*3\s*\)/.test(code) && /(right|left)\s*\(\s*120\s*\)/.test(code),
        win: "A triangle! Loops are one of programming's biggest superpowers."
      }
    ]
  },
  {
    name: "Game maker",
    short: "Level 2",
    learned: [
      "Lists keep lots of things in one box, and counting starts at 0",
      "<code class='k'>.append()</code> adds something to the end of a list",
      "<code class='k'>random</code> lets Python roll dice and pick surprises",
      "<code class='k'>while</code> loops keep going until something changes",
      "<code class='k'>elif</code> checks another choice, like <i>too high</i> or <i>too low</i>",
      "Mixing lists, loops and random makes art"
    ],
    certLine: "Level 2: Game Maker",
    skills: "lists · random · while loops · elif · counting · turtle art",
    steps: [
      {
        id: "lists", nav: "Lists",
        title: "Lists hold lots of things",
        pip: [
          "A <b>list</b> is a box that holds lots of things in order. You make one with square brackets <code class='k'>[ ]</code> and commas between each item.",
          "Here's a funny thing: Python starts counting at <b>0</b>, not 1. So <code class='k'>snacks[0]</code> is the first snack.",
          "<code class='k'>snacks.append(\"grapes\")</code> adds grapes to the end of the list."
        ],
        code: 'snacks = ["apple", "crisps", "cake"]\n\nprint("My first snack is", snacks[0])\nprint("My last snack is", snacks[2])\n\nsnacks.append("grapes")\nprint(snacks)\nprint("I have", len(snacks), "snacks")',
        mission: "Use <code class='k'>.append()</code> to add <b>your</b> favourite snack to the list, and run it so Python says you have 5 snacks.",
        hint: 'Add a line under the grapes line: <code>snacks.append("popcorn")</code>',
        check: (code, out) => (code.match(/\.append\s*\(/g) || []).length >= 2 && /\b5\s+snacks/.test(out),
        win: "Five snacks! Lists can hold as many things as you like."
      },
      {
        id: "random", nav: "Random",
        title: "Roll the dice",
        pip: [
          "<code class='k'>import random</code> gives Python a bag of surprises.",
          "<code class='k'>random.randint(1, 6)</code> picks a random whole number from 1 to 6, just like rolling a dice.",
          "<code class='k'>random.choice(list)</code> picks one thing from a list without looking. Run it a few times. Do you get the same answer every time?"
        ],

function drawStar(g, cx, cy, r, fill, stroke) {

function editorKeys(e) {
  const ta = e.target;
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); run(); return; }
  if (e.key === "Tab" && !e.shiftKey) { e.preventDefault(); insert(ta, "    "); return; }
  if (e.key === "Enter") {
    const before = ta.value.slice(0, ta.selectionStart);
    const line = before.split("\n").pop();
    let indent = line.match(/^\s*/)[0];
    if (/:\s*$/.test(line)) indent += "    ";
    e.preventDefault(); insert(ta, "\n" + indent);
  }
}
function insert(ta, text) {
  const s = ta.selectionStart, en = ta.selectionEnd;
  ta.value = ta.value.slice(0, s) + text + ta.value.slice(en);
  ta.selectionStart = ta.selectionEnd = s + text.length;
  ta.dispatchEvent(new Event("input"));
}

function friendly(err) {
  const msg = err.toString();
  const line = (msg.match(/on line (\d+)/) || [])[1];
  const where = line ? ` Have a look at <b>line ${line}</b>.` : "";
  if (/SyntaxError|IndentationError|TokenError/.test(msg)) {
    if (/Indent/.test(msg)) return `<strong>Python is fussy about spaces.</strong> Lines inside an <code class="k">if</code> or a loop need 4 spaces at the start.${where}`;
    return `<strong>Python got confused by the spelling.</strong> Check that every quote mark <code class="k">"</code> and bracket <code class="k">(</code> or <code class="k">[</code> has a partner, and that lines starting with <code class="k">if</code>, <code class="k">elif</code>, <code class="k">else</code>, <code class="k">for</code> or <code class="k">while</code> end with a colon <code class="k">:</code>.${where}`;
  }
  if (/NameError/.test(msg)) {
    const nm = (msg.match(/name '([^']+)'/) || [])[1];
    return `<strong>Python doesn't know the word ${nm ? "<code class='k'>" + esc(nm) + "</code>" : "you used"}.</strong> Check the spelling. If it's meant to be words to show, put quote marks round it.${where}`;
  }
  if (/IndexError/.test(msg)) return `<strong>That list isn't that long!</strong> Remember Python starts counting at 0, so a list of 3 things has spots 0, 1 and 2.${where}`;
  if (/TypeError/.test(msg) && /str/.test(msg)) return `<strong>Words and numbers got mixed up.</strong> You can only glue words to words with <code class="k">+</code>. Try using a comma in <code class="k">print</code> instead, or wrap the number in <code class="k">str()</code>.${where}`;
  if (/ValueError/.test(msg)) return `<strong>Python wanted a number.</strong> Type digits like <code class="k">7</code>, not words like <i>seven</i>.${where}`;
  if (/ZeroDivision/.test(msg)) return `<strong>Nobody can divide by zero</strong>, not even Python!${where}`;
  if (/TimeLimit/.test(msg)) return `<strong>Your program ran for too long</strong>, so Pip stopped it. Is there a loop that never ends?`;
  if (/AttributeError/.test(msg)) return `<strong>Python doesn't know that command.</strong> Check the spelling of the word after the dot.${where}`;
  return `<strong>Oops, something went wrong:</strong> <code class="k">${esc(msg)}</code>`;
}

let running = false;
function askUser(prompt) {
  return new Promise(resolve => {
    $("out").append(document.createTextNode(prompt));
    $("ask").innerHTML = `<form class="ask" id="askform"><input id="askinput" autocomplete="off" aria-label="Type your answer"><button class="btn run" type="submit">Enter</button></form>`;
    const inp = $("askinput"); inp.focus({ preventScroll: true });
    $("askform").onsubmit = (ev) => {
      ev.preventDefault();
      const v = inp.value;
      $("out").append(document.createTextNode(v + "\n"));
      $("ask").innerHTML = "";
      Sk.execStart = Date.now(); // waiting for an answer doesn't count towards the time limit
      resolve(v);
    };
  });
}

function run() {
  if (running || !window.Sk) return;
  const s = lvl().steps[state.step], code = $("code").value;
  running = true; $("run").disabled = true;
  $("out").innerHTML = ""; $("ask").innerHTML = ""; $("helper").innerHTML = "";
  let output = "";
  const stage = $("stage");
  const usesTurtle = /import\s+turtle/.test(code);
  stage.classList.toggle("show", usesTurtle);
  if (Sk.TurtleGraphics && Sk.TurtleGraphics.reset) { try { Sk.TurtleGraphics.reset(); } catch (e) {} }
  (Sk.TurtleGraphics || (Sk.TurtleGraphics = {})).target = "stage";
  Sk.TurtleGraphics.width = 300; Sk.TurtleGraphics.height = 300;
  Sk.configure({
    __future__: Sk.python3,
    output: (t) => { output += t; const o = $("out"); o.append(document.createTextNode(t)); o.scrollTop = o.scrollHeight; },
    read: (f) => { if (!Sk.builtinFiles || !Sk.builtinFiles.files[f]) throw "File not found: " + f; return Sk.builtinFiles.files[f]; },
    inputfun: askUser, inputfunTakesPrompt: true,
    execLimit: 15000, yieldLimit: 100, killableWhile: true, killableFor: true
  });
  Sk.execStart = Date.now();
  Sk.misceval.asyncToPromise(() => Sk.importMainWithBody("<stdin>", false, code, true))
    .then(() => {
      if (!output && !usesTurtle) $("out").innerHTML = '<span class="placeholder">Your code ran, but it didn\'t print anything. Try adding print().</span>';
      if (s.check(code, output)) win(s);
      else if (!state.done.includes(s.id)) $("status").textContent = "Code ran! Now see if you can complete the mission below.";
    })
    .catch((err) => { $("helper").innerHTML = `<div class="helper">${friendly(err)}</div>`; })
    .finally(() => { running = false; const r = $("run"); if (r) r.disabled = false; const a = $("ask"); if (a) a.innerHTML = ""; });
}

function win(s) {
  const first = !state.done.includes(s.id);
  if (first) { state.done.push(s.id); save(); }
  $("mission").classList.add("won");
  $("status").textContent = "Mission complete! " + s.win;
  const ms = $("mission").querySelector(".star"); if (ms) ms.classList.add("on");
  if (first) { renderStars(s.id); renderPath(); renderLevels(); burst(); }
}

function burst() {
  const r = $("run").getBoundingClientRect();
  const colors = ["#FFC83D", "#2F8A57", "#D8513B", "#4AA3DF"];
  for (let k = 0; k < 24; k++) {
    const d = document.createElement("div");
    d.className = "burst";
    d.style.left = (r.left + r.width / 2) + "px"; d.style.top = (r.top + r.height / 2) + "px";
    d.style.background = colors[k % colors.length];
    const a = Math.random() * Math.PI * 2, dist = 80 + Math.random() * 120;
    d.style.setProperty("--dx", Math.cos(a) * dist + "px");
    d.style.setProperty("--dy", Math.sin(a) * dist - 60 + "px");
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 1000);
  }
}

render();
if (window.Sk) $("loading").remove();
else $("loading").textContent = "Python couldn't load. If you opened this file on your computer, make sure the engine folder is next to it.";
</script>
